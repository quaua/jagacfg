// -------------
// Mouse
// -------------
// Mouse movement and aiming
// -------------------

sensitivity 3														 // my sensitivity with raw input enabled (3)
zoom_sensitivity_ratio .793471                                       // sensitivity in zoom (.793471)
m_rawinput 1                                                         // raw input mouse (1)
m_filter 0                                                           // better disable it (0)
m_pitch 0.022                                                        // Pitch factor. 0.022 is default
m_yaw 0.022															 // Yaw factor. 0.022 is default
m_mousespeed 0                                                       // better disable it (0)
m_mouseaccel1 0                                                      // better disable it (0)
m_mouseaccel2 0                                                      // better disable it (0)
m_customaccel 0                                                      // better disable it (0)
m_customaccel_scale 0                                                // better disable it (0)
m_customaccel_max 0                                                  // better disable it (0)
m_customaccel_exponent 0                                             // better disable it (0)

// ----------------------------------------------------------------------------
// Combat Text
// ----------------------------------------------------------------------------
// Damage and healing text above players
// ----------------------------------------------------------------------------

hud_combattext 1                                                     // turns on the damage text above enemies (1)
hud_combattext_batching 1                                            // turns on the damage text above players adding together within an interval (1)
hud_combattext_batching_window 2                                     // time in seconds to combine damage text (2)
hud_combattext_healing 1 	                                         // shows healing text (1)
hud_combattext_doesnt_block_overhead_text 1                          // allow CRIT! to appear (1)

// ----------------------------------------------------------------------------
// Hitsounds
// ----------------------------------------------------------------------------
// Damage sound played on hit and on kill
// ----------------------------------------------------------------------------

tf_dingalingaling_lasthit 1                                          // if set to 1, play a sound whenever one of your attacks kills an enemy (1)
tf_dingaling_lasthit_volume 99 			                             // killsound volume (99)
tf_dingaling_lasthit_pitchmaxdmg 65 		                         // pitch for killsound on >=150 damage (65)
tf_dingaling_lasthit_pitchmindmg 127 		                         // pitch for killsound on <=10 damage (127)
tf_dingaling_lasthit_pitch_override -1 	                             // pitch for all killsounds, if set (-1)

tf_dingalingaling 1													 // turns on weapon hit sound (1)
tf_dingaling_volume 99         										 // sets the volume for hitsounds (99)
tf_dingaling_pitchmaxdmg 65											 // sets the pitch of maximum damage with your weapon (65)
tf_dingaling_pitchmindmg 127										 // sets the pitch of minimum damage with your weapon (127)
tf_dingaling_pitch_override -1 	                                     // pitch for all hitsounds, if set (-1)

tf_dingalingaling_repeat_delay 0.008	                             // the delay in seconds before playing the hitsound again (0.008)

// ----------------------------------------------------------------------------
// View
// ----------------------------------------------------------------------------
// The character view and viewmodel
// ----------------------------------------------------------------------------

fov_desired 200														 // see more of the battlefield (200)
viewmodel_fov 75                                                     // fov of viewmodel (75)

cl_flipviewmodels 0 					                             // right viewmodels, shoot right of a corner (0)
cl_first_person_uses_world_model 0                                   // disables "real" viewmodels (0)

tf_use_min_viewmodels 1                                              // enables min viewmodels (1)
tf_sheen_alpha_firstperson 1                                         // enables sheen (1)
tf_enable_glows_after_respawn 1 									 // enable spawn xrays (1)
tf_spec_xray_disable 0 			                                     // enable xrays while spectating (0)
tf_spectate_pyrovision 0 	                                         // do not force use pyrovision in spectator mode (0)

r_drawviewmodel 1													 // enables first person viewmodel (1)
r_drawtracers_firstperson 1 	                                     // enables first person tracers (1)

glow_outline_effect_enable 1 		                                 // enable ally and objective xrays (1)

// ----------------------------------------------------------------------------
// Gameplay + MonitorGamma
// ----------------------------------------------------------------------------
// Adjusts how the game behaves
// ----------------------------------------------------------------------------

mat_monitorgamma 0                                                   // brightness of tf2, less value makes game brighter (0)

cl_particle_batch_mode 1

cl_autoreload 1                                                      // enables auto reload (1)
cl_autorezoom 0     											     // disables rezoom after shot for Sniper (0)

tf_simple_disguise_menu 1											 // soncise disguise menu (1)
tf_sniper_fullcharge_bell 1                                          // when the sniper rifle is fully charged, the bell sound plays (1)
tf_remember_activeweapon 1                                           // if set, you'll respawn holding the same weapon you were holding when you died (1)
tf_remember_lastswitched 0                                           // remember quick switch weapon (0)
tf_respawn_on_loadoutchanges 1                                       // if set, then you'll immediately respawn whenever you change your loadout while inside a respawn zone (1)
tf_scoreboard_mouse_mode 2                                           // use mouse mode only when clicking on the scoreboard, look around otherwise (2)
tf_medigun_autoheal 1                                                // turns on healing without holding attack (1)
tf_build_menu_controller_mode 0                                      // use controller style engineer build menu (0)
tf_colorblindassist 0                                                // If set, several in-game effects that are harder for colorblind players to see will use alternate, more visible effects (0)

hud_fastswitch 1                                                     // fast weapon change (1)
hud_classautokill 0                                                  // no suicide on class change (0)
hud_medichealtargetmarker 1                                          // if set, a marker will be displayed above the friendly target that you're currently healing (1)

// ----------------------------------------------------------------------------
// Closed Captions
// ----------------------------------------------------------------------------
// Customization of notifications of sounds and voices in closed captions
// ----------------------------------------------------------------------------

cc_linger_time 1 					                                 // close caption linger time (1)
cc_minvisibleitems 1 				                                 // minimum number of caption items to show (1)
cc_predisplay_time 0 				                                 // close caption delay before showing caption (0)
cc_sentencecaptionnorepeat 4 		                                 // How often a sentence can repeat (4)
snd_vox_captiontrace 0 		    	                                 // shows sentence name for sentences which are set not to show captions (0)

// ----------------------------------------------------------------------------
// Demo Support
// ----------------------------------------------------------------------------

ds_enable 2                                                          // 0 - Manual
				                                                     // 1 - Record competitive matchmaking
															         // 2 - Record everything
																	 // 3 - Record mp_tournament matches
ds_autodelete 1                                                      // automatically delete .dem files with no associated bookmark or kill streak events (0)
ds_dir demos 		                                                 // put all recorded demos in this folder (under tf/)
ds_kill_delay 300 	                                                 // maximum time between kills for tracking kill streaks (300)
ds_log 1                                                             // log kill streak and bookmark events to an associated .txt file (1)
ds_min_streak 1 	                                                 // minimum killstreak count before logging it (1)
ds_notify 1 		                                                 // output when getting a killstreak or bookmarking (1)
ds_prefix demoofgame_ 		                                         // prefix file names with this text
ds_screens 1 		                                                 // take a screenshot of the scoreboard when the round ends (1)
ds_sound 1 		                                                     // play the filming sound effect for when demo support starts and stops recording (1)

// ----------------------------------------------------------------------------
// Binds and Crosshair
// ----------------------------------------------------------------------------

unbindall
bind 1 slot1
bind 2 slot2
bind 3 slot3
bind p slot10
bind W +forward
bind S +back
bind A +moveleft
bind D +moveright
bind Q "+use_action_slot_item"
bind E "+helpme"
bind MOUSE5 +duck
bind L dropitem
bind MOUSE1 +attack
bind MOUSE2 +attack2
bind MOUSE3 +attack3
bind R +reload
bind "MWHEELUP" "+jump"
bind "MWHEELDOWN" "+jump"
bind ` toggleconsole
bind Y say
bind U say_team
bind ' say_party
bind Z voice_menu_1
bind X voice_menu_2
bind C voice_menu_3
bind , changeclass
bind . changeteam
bind SHIFT"cmd kill"
bind CTRL"cmd explode"
bind M open_charinfo_direct
bind F1 show_quest_log
bind G +taunt
bind SEMICOLON"toggle r_drawviewmodel"
bind F2 player_ready_toggle
bind ["impulse 201"
bind F12 screenshot
bind ENTER cl_trigger_first_notification
bind BACKSPACE cl_decline_first_notification
bind ESCAPE escape
bind F4 sm_taunt
bind F +inspect
bind T "taunt 8"
bind N +voicerecord
bind v "load_itempreset 0"
bind leftarrow "load_itempreset 1"
bind downarrow "load_itempreset 2"
bind rightarrow "load_itempreset 3"
bind h "+use"
bind / "toggle tf_use_min_viewmodels 0 1"
bind j "say_team THERE IS A SPY! LOOK BEHIND YOU!"
bind k "snd_restart"
bind f10 "disconnect"
bind "space" "+jump"
bind tab +score

crosshair 1;cl_crosshair_file crosshair5;cl_crosshair_green 255;cl_crosshair_red 0;cl_crosshair_blue 0;cl_crosshair_scale 14;
