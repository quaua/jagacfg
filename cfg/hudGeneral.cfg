// ----------------------------------------------------------------------------
// HUD
// ----------------------------------------------------------------------------
// General/misc HUD settings
// ----------------------------------------------------------------------------

cl_hud_playerclass_use_playermodel 1								 // enables 3d player in hud (1)
cl_hud_minmode 0                                                     // disables min mode for hud (0)
cl_software_cursor 0                                                 // switches OS cursor to cursor of the game (0)
cl_disablehtmlmotd 1                                                 // disable html motd (1)

tf_scoreboard_alt_class_icons 0                                      // alternate class icons on the scoreboard (0)
tf_mm_dashboard_slide_panel_step 20                                  // change the horizontal offset of the primary matchmaking panel (20)
tf_dashboard_slide_time 0                                            // time in seconds for dashboard transitions (0)
tf_item_inspect_model_auto_spin 1                                    // auto spin items in the inspect view (1)
tf_item_inspect_model_spin_rate 20                                   // spin speed items in the inspect view (20)
tf_quest_map_tuner_wobble_magnitude 0.01                             // enable red tuner at the bottom (0.01)
tf_hud_no_crosshair_on_scope_zoom 0                                  // enable crosshair in sniper scope (0)
tf_hud_num_building_alert_beeps 3                                    // number of times to play warning sound when a new alert displays on building hud objects (3)
tf_hud_show_servertimelimit 1                                        // show server map time
tf_use_match_hud 1                                                   // show the players in top bar in game (1)
tf_hud_target_id_alpha 255											 // target id alpha (255)
tf_hud_target_id_disable_floating_health 1							 // disable floating health (1)
tf_hud_target_id_offset 0                                            // vertical offset of targetid (0)
tf_hud_target_id_show_avatars 0                                      // show players avatar (0)
tf_spectator_target_location 0                                       // controls where to place targetid in spectator mode (0)
tf_scoreboard_ping_as_text 1                                         // show ping as text in scoreboard (1)
tf_queue_spinner_color 0                                             // color of tf2 logo while searching game (0)

hud_deathnotice_time 5                                               // killfeed time until disappear

// ----------------------------------------------------------------------------
// Info
// ----------------------------------------------------------------------------
// Additional HUD elements for extra info
// Adding additional HUD elements decreases FPS by a small amount
// ----------------------------------------------------------------------------

cl_showhelp 0
cl_showfps 1														 // shows fps (1)
cl_showpos 1                                                         // shows pos and velocity (1)
cl_mvm_wave_status_visible_during_wave 1                             // mvm wave information during the wave (1)

// ----------------------------------------------------------------------------
// Backpack
// ----------------------------------------------------------------------------
// Inventory, economy and backpack
// ----------------------------------------------------------------------------

cl_spec_carrieditems 1												 // shows non-standard items being carried by player you're spectating (1)
cl_showbackpackrarities 1											 // shows rarities in backpack (1)

tf_time_loading_item_panels 0.0003 		                             // decrease time spent per frame loading item panels (0.0003)	
tf_backpack_page_button_delay 0.25 		                             // decrease button delay for moving items (0.25)
