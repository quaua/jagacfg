// ----------------------------------------------------------------------------
// Killstreaks
// ----------------------------------------------------------------------------
// Killstreak messages from weapons
// ----------------------------------------------------------------------------

cl_hud_killstreak_display_time 3                                     // how long a killstreak notice stays on the screen (3)
cl_hud_killstreak_display_alpha 255 	                             // adjusts font alpha value of killstreak notices (255)
cl_hud_killstreak_display_fontsize 1                                 // adjusts font size of killstreak notices (1)

// ----------------------------------------------------------------------------
// Notifications
// ----------------------------------------------------------------------------
// In-game notifications for trade offers, requests, events, etc
// ----------------------------------------------------------------------------

tf_hud_notification_duration 2                                       // how long to display hud notification panels before fading them (2)
tf_notifications_push_bottom 0                                       // keep notifications at the top of the stack (0)

cl_notifications_max_num_visible 1                                   // how many notifications are visible in-game (1)
cl_notifications_move_time 0.1                                       // how long it takes for a notification to move (0.1)
cl_vote_ui_active_after_voting 0                                     // hide the vote UI after voting (0)

// ----------------------------------------------------------------------------
// Contracts
// ----------------------------------------------------------------------------
// Contracts as part of campaigns
// ----------------------------------------------------------------------------

tf_contract_progress_show 2
tf_contract_competitive_show 0 	                                     // during competitive matches, contract visibility:
									                                 // 0 - never
									                                 // 1 - all
									                                 // 2 - active only
tf_quest_notification_line_delay 0.2                                 // shorter voice line delay after contract (0.2)

// ----------------------------------------------------------------------------
// Achievements
// ----------------------------------------------------------------------------
// Achievement effects and HUD tracker
// ----------------------------------------------------------------------------

hud_achievement_glowtime 1                                           // duration of glow effect around incremented achievements (1)
hud_achievement_tracker 1                                            // show or hide the achievement tracker (1)
hud_achievement_count 4                                              // max achievements shown on HUD (4)

// ----------------------------------------------------------------------------
// Messages
// ----------------------------------------------------------------------------
// Text chat and other messages
// ----------------------------------------------------------------------------
hud_saytext_time 15                      							 // how long to display chat comments before they fade out (15)

cl_showtextmsg 0                                                     // disable text messages in chat (voice lines) (0)
cl_showpluginmessages 1                                              // show messages from server plugins (1)
cl_mute_all_comms 1                                                  // disable text and voice for muted players (1)

tf_chat_popup_hold_time 5                                            // how long party messages appear on the main menu (5)